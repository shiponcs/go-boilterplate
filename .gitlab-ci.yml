# Minimal CI pipeline: build + test on every push; image build/deploy on tags.
# Adjust the registry, Helm chart, and deploy steps to your infrastructure.
stages:
  - test
  - build
  - deploy

variables:
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"

test:
  stage: test
  image: golang:1.23.1
  script:
    - go vet ./...
    - go test ./... -count=1
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"
  rules:
    - if: '$CI_COMMIT_TAG'

deploy-stage:
  stage: deploy
  image: alpine/helm:latest
  script:
    - echo "helm upgrade --install ... --set image.tag=$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^qa-/'
      when: manual

deploy-prod:
  stage: deploy
  image: alpine/helm:latest
  script:
    - echo "helm upgrade --install ... --set image.tag=$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-/'
      when: manual
